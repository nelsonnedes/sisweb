<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normalizar Folhas Quinzena (tipoPagamento)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 20px; color: #222; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; margin-right: 8px; font-weight: 600; }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-success { background: #27ae60; color: #fff; }
    .log { background: #f9fafb; border: 1px solid #eee; border-radius: 6px; padding: 10px; height: 280px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    .stats { display: flex; gap: 12px; margin-top: 10px; }
    .stat { background: #eef2f7; border: 1px solid #d9e2ec; border-radius: 6px; padding: 8px 10px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; color: #fff; }
    .badge-mes { background: #28a745; }
    .badge-quinzena { background: #17a2b8; }
    .small { color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Normalizar Folhas de Quinzena (tipoPagamento)</h1>
  <p class="small">Esta ferramenta atualiza somente os registros que são quinzena, mas ainda não têm <code>tipoPagamento</code> ou estão com valor incorreto. Registros mensais e mês fechado não são alterados.</p>

  <div class="card">
    <div style="margin-bottom: 12px;">
      <button id="btnDryRun" class="btn btn-warning">Analisar (Dry Run)</button>
      <button id="btnApply" class="btn btn-primary" disabled>Aplicar Normalização</button>
      <button id="btnReset" class="btn btn-danger" disabled>Reset</button>
    </div>
    <div class="stats">
      <div class="stat">Total carregado: <span id="statTotal">0</span></div>
      <div class="stat">Elegíveis (atualizar para quinzena): <span id="statElegiveis">0</span></div>
      <div class="stat">Atualizados: <span id="statAtualizados">0</span></div>
    </div>
    <div id="log" class="log"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, get, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

    // Inicialização simples usando databaseURL (conforme logs da aplicação)
    const app = initializeApp({
      databaseURL: 'https://sisweb-7ce82-default-rtdb.asia-southeast1.firebasedatabase.app'
    });
    const db = getDatabase(app);

    const logEl = document.getElementById('log');
    const btnDryRun = document.getElementById('btnDryRun');
    const btnApply = document.getElementById('btnApply');
    const btnReset = document.getElementById('btnReset');
    const statTotal = document.getElementById('statTotal');
    const statElegiveis = document.getElementById('statElegiveis');
    const statAtualizados = document.getElementById('statAtualizados');

    let folhas = [];
    let elegiveis = [];
    let atualizados = 0;

    const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z_]/g,'');
    const parsePercent = (raw) => {
      if (raw == null || raw === '') return NaN;
      const s = String(raw).trim().replace(/[^0-9,.-]/g,'');
      const n = s.includes(',') ? parseFloat(s.replace(/\./g,'').replace(/,/g,'.')) : parseFloat(s);
      return isNaN(n) ? NaN : n;
    };
    const hasQuinzenaHints = (f) => {
      const c = f.calculos || {};
      const calc = c.calculos || c;
      const candidates = [
        f.quinzenaPercentual,
        f.percentualQuinzena,
        (calc && calc.percentualQuinzena)
      ];
      const manual = Number(f.quinzenaValorManual || 0) > 0;
      const percOk = candidates.some((x) => { const n = parsePercent(x); return !isNaN(n) && n > 0 && n <= 100; });
      const tipoRaw = norm(f.tipo || f.tipoPagamento || f.tipoFolha);
      const statusRaw = norm(f.status);
      const tipoQz = ['quinzena','quinzenal','quinzena_paga','quinzenapaga'].includes(tipoRaw);
      const statusQz = ['quinzena_paga'].includes(statusRaw);
      return manual || percOk || tipoQz || statusQz;
    };
    const isMesFechado = (f) => {
      const t = norm(f.tipo || f.tipoPagamento || f.tipoFolha);
      const s = norm(f.status);
      return t === 'mes' || t === 'mes_fechado' || s === 'mes_fechado';
    };

    const log = (msg) => { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; };
    const setStats = () => {
      statTotal.textContent = String(folhas.length);
      statElegiveis.textContent = String(elegiveis.length);
      statAtualizados.textContent = String(atualizados);
    };
    const reset = () => { folhas = []; elegiveis = []; atualizados = 0; logEl.textContent = ''; setStats(); btnApply.disabled = true; btnReset.disabled = true; };

    btnReset.addEventListener('click', reset);

    btnDryRun.addEventListener('click', async () => {
      reset();
      log('🔄 Carregando folhas do RTDB...');
      try {
        const snap = await get(ref(db, 'folhas'));
        const val = snap.val() || {};
        folhas = Object.entries(val).map(([id, v]) => ({ id, ...(v||{}) }));
        setStats();
        log(`📦 ${folhas.length} folhas carregadas.`);
        const candidatos = [];
        for (const f of folhas) {
          // Se já é mês fechado/mês, pular
          if (isMesFechado(f)) { continue; }
          const tp = norm(f.tipoPagamento);
          const tipoRaw = norm(f.tipo || f.tipoFolha);
          const precisa = (!tp || tp === 'mes') && hasQuinzenaHints(f);
          if (precisa) {
            candidatos.push({ id: f.id, funcionario: f.funcionario && f.funcionario.nome, tipo: tipoRaw || '(vazio)' });
            log(`➡️ Elegível: ${f.id} | ${(f.funcionario && f.funcionario.nome) || 'N/A'} | tipoAtual=${tipoRaw || '(vazio)'}`);
          }
        }
        elegiveis = candidatos;
        setStats();
        btnApply.disabled = elegiveis.length === 0;
        btnReset.disabled = false;
        log(`✅ Análise concluída. ${elegiveis.length} registro(s) elegível(eis).`);
      } catch (e) {
        log('❌ Erro ao carregar folhas: ' + (e && e.message));
      }
    });

    btnApply.addEventListener('click', async () => {
      if (elegiveis.length === 0) { return; }
      const ok = confirm(`Aplicar normalização em ${elegiveis.length} registro(s)?\nSomente 'tipoPagamento' será atualizado para 'quinzena'.`);
      if (!ok) return;
      log('🔧 Aplicando normalização...');
      try {
        const resolvePath = (p) => {
          try {
            if (window.FolhaUtils && typeof window.FolhaUtils.resolveFirebasePath === 'function') {
              return window.FolhaUtils.resolveFirebasePath(p);
            }
            const svc = window.firebaseService || window.firebaseServiceTL || window.FirebaseService;
            if (svc && typeof svc.getNamespacedPath === 'function') {
              return svc.getNamespacedPath(p);
            }
          } catch {}
          return p;
        };
        for (const item of elegiveis) {
          await update(ref(db, resolvePath(`folhas/${item.id}`)), { tipoPagamento: 'quinzena' });
          atualizados++;
          log(`✅ Atualizado: ${item.id} | ${item.funcionario || 'N/A'}`);
        }
        setStats();
        log('🎉 Normalização concluída com sucesso.');
      } catch (e) {
        log('❌ Erro ao aplicar normalização: ' + (e && e.message));
      }
    });
  </script>
  <script src="../global-footer.js"></script>
</body>
</html>
