<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Modal Integrado - Folha de Pagamento</title>
    
    <!-- CSS do sistema -->
    <link rel="stylesheet" href="../layout-comum.css">
    <link rel="stylesheet" href="../menu.css">
    <link rel="stylesheet" href="folha.css">
    
    <!-- Menu Component -->
    <script src="../menu-component.js?v=20260326"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyCF_9e067URYnB6iGnTAahPfaTMl-RQ77k",
            authDomain: "sisweb-7ce82.firebaseapp.com",
            databaseURL: "https://sisweb-7ce82-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sisweb-7ce82",
            storageBucket: "sisweb-7ce82.firebasestorage.app",
            messagingSenderId: "240003261222",
            appId: "1:240003261222:web:1aeaf919ddc7e5c691d7e7",
            measurementId: "G-FTC6JZ5ZGX"
        };
        
        const app = initializeApp(firebaseConfig);
        window.database = getDatabase(app);
        
        console.log('🔥 Firebase inicializado para teste');
    </script>
</head>
<body>
    <div class="container">
        <!-- Menu Component -->
        <main-menu></main-menu>
        
        <!-- Título -->
        <h1><i class="fas fa-file-invoice-dollar"></i> Teste Modal Integrado</h1>
        
        <!-- 💰 INDICADOR DE CONTAS CRIADAS -->
        <section id="indicador-contas-section" style="display: none;">
            <div class="indicador-contas">
                <div class="indicador-item">
                    <i class="fas fa-check-circle" style="color: #28a745;"></i>
                    <span id="contasQuinzena">0</span> Quinzenas Pagas
                </div>
                <div class="indicador-item">
                    <i class="fas fa-archive" style="color: #6f42c1;"></i>
                    <span id="contasMes">0</span> Meses Fechados
                </div>
                <div class="indicador-item">
                    <i class="fas fa-external-link-alt" style="color: #007bff;"></i>
                    <a href="../financas.html" target="_blank" class="link-sistema-financeiro">
                        Ver no Sistema Financeiro
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Botões de Teste -->
        <section id="botoes-teste">
            <h2>Testes do Modal Integrado</h2>
            
            <div class="form-buttons">
                <button type="button" class="btn-adicionar" onclick="testarModalQuinzena()">
                    <i class="fas fa-money-bill-wave"></i> Testar Modal Quinzena
                </button>
                
                <button type="button" class="btn-salvar" onclick="testarModalMes()">
                    <i class="fas fa-calendar-check"></i> Testar Modal Mês
                </button>
                
                <button type="button" class="btn-listar" onclick="testarIndicador()">
                    <i class="fas fa-chart-bar"></i> Testar Indicador
                </button>
                
                <button type="button" class="btn-editar" onclick="limparIndicador()">
                    <i class="fas fa-trash"></i> Limpar Indicador
                </button>
            </div>
        </section>
        
        <!-- Resultados dos Testes -->
        <section id="resultados-teste">
            <h2>Resultados dos Testes</h2>
            <div id="log-teste" style="background: #f8f9fa; padding: 20px; border-radius: 8px; font-family: monospace; max-height: 400px; overflow-y: auto;">
                <p>Clique nos botões acima para executar os testes...</p>
            </div>
        </section>
    </div>
    
    <!-- Scripts de Teste -->
    <script>
        // Simular dados de teste
        const dadosTesteQuinzena = {
            id: 'TESTE_QUINZENA_001',
            funcionarioNome: 'João Silva',
            valorTotal: 1500.00,
            dataVencimento: '2025-01-15',
            descricao: 'Quinzena - Janeiro/2025',
            tipo: 'quinzena'
        };
        
        const dadosTesteMes = {
            id: 'TESTE_MES_001',
            funcionarioNome: 'Maria Santos',
            valorTotal: 3200.00,
            dataVencimento: '2025-01-31',
            descricao: 'Mês Completo - Janeiro/2025',
            tipo: 'mes_completo'
        };
        
        // Função para adicionar log
        function adicionarLog(mensagem, tipo = 'info') {
            const logElement = document.getElementById('log-teste');
            const timestamp = new Date().toLocaleTimeString();
            const classe = tipo === 'error' ? 'color: red;' : tipo === 'success' ? 'color: green;' : 'color: blue;';
            
            logElement.innerHTML += `<p style="${classe}">[${timestamp}] ${mensagem}</p>`;
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // Testar modal de quinzena
        function testarModalQuinzena() {
            try {
                adicionarLog('🧪 Testando modal de quinzena...', 'info');
                
                // Simular criação de conta a pagar
                if (window.folhaLancamentos && window.folhaLancamentos.mostrarModalConfirmacaoContaPagar) {
                    window.folhaLancamentos.mostrarModalConfirmacaoContaPagar(dadosTesteQuinzena, 'quinzena');
                    adicionarLog('✅ Modal de quinzena exibido com sucesso!', 'success');
                } else {
                    adicionarLog('❌ Função mostrarModalConfirmacaoContaPagar não encontrada', 'error');
                }
            } catch (error) {
                adicionarLog(`❌ Erro ao testar modal de quinzena: ${error.message}`, 'error');
            }
        }
        
        // Testar modal de mês
        function testarModalMes() {
            try {
                adicionarLog('🧪 Testando modal de mês...', 'info');
                
                // Simular criação de conta a pagar
                if (window.folhaLancamentos && window.folhaLancamentos.mostrarModalConfirmacaoContaPagar) {
                    window.folhaLancamentos.mostrarModalConfirmacaoContaPagar(dadosTesteMes, 'mes_completo');
                    adicionarLog('✅ Modal de mês exibido com sucesso!', 'success');
                } else {
                    adicionarLog('❌ Função mostrarModalConfirmacaoContaPagar não encontrada', 'error');
                }
            } catch (error) {
                adicionarLog(`❌ Erro ao testar modal de mês: ${error.message}`, 'error');
            }
        }
        
        // Testar indicador
        function testarIndicador() {
            try {
                adicionarLog('🧪 Testando indicador de contas...', 'info');
                
                // Simular atualização do indicador
                if (window.folhaLancamentos && window.folhaLancamentos.atualizarIndicadorContas) {
                    window.folhaLancamentos.atualizarIndicadorContas();
                    adicionarLog('✅ Indicador de contas atualizado!', 'success');
                } else {
                    adicionarLog('❌ Função atualizarIndicadorContas não encontrada', 'error');
                }
            } catch (error) {
                adicionarLog(`❌ Erro ao testar indicador: ${error.message}`, 'error');
            }
        }
        
        // Limpar indicador
        function limparIndicador() {
            try {
                adicionarLog('🧹 Limpando indicador...', 'info');
                
                const indicadorSection = document.getElementById('indicador-contas-section');
                if (indicadorSection) {
                    indicadorSection.style.display = 'none';
                    indicadorSection.classList.remove('indicador-ativo');
                    adicionarLog('✅ Indicador limpo com sucesso!', 'success');
                } else {
                    adicionarLog('❌ Seção do indicador não encontrada', 'error');
                }
            } catch (error) {
                adicionarLog(`❌ Erro ao limpar indicador: ${error.message}`, 'error');
            }
        }
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            adicionarLog('🚀 Página de teste carregada', 'success');
            adicionarLog('📋 Aguardando carregamento dos módulos...', 'info');
            
            // Aguardar carregamento dos módulos
            let tentativas = 0;
            const maxTentativas = 10;
            
            const verificarModulos = setInterval(() => {
                tentativas++;
                
                if (window.folhaLancamentos) {
                    adicionarLog('✅ Módulo folhaLancamentos carregado', 'success');
                    clearInterval(verificarModulos);
                } else if (tentativas >= maxTentativas) {
                    adicionarLog('❌ Timeout: Módulo folhaLancamentos não carregado', 'error');
                    clearInterval(verificarModulos);
                } else {
                    adicionarLog(`⏳ Aguardando módulos... (${tentativas}/${maxTentativas})`, 'info');
                }
            }, 500);
        });
    </script>
</body>
</html>
