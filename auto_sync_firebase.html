<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔄 Auto-Sync Firebase → localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
            transition: all 0.3s;
        }
        .btn:hover { background: #45a049; transform: scale(1.05); }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }
        .btn-info { background: #2196F3; }
        .status {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
        }
        .success { background: rgba(76, 175, 80, 0.3); }
        .error { background: rgba(244, 67, 54, 0.3); }
        .warning { background: rgba(255, 193, 7, 0.3); }
        .info { background: rgba(33, 150, 243, 0.3); }
        .log {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 15px 0;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Auto-Sync Firebase → localStorage</h1>
        <p>Sincronização automática inteligente de dados</p>
        
        <div class="grid">
            <div>
                <h3>🚀 Ações Principais</h3>
                <button class="btn" onclick="iniciarAutoSync()">🔄 Iniciar Auto-Sync</button>
                <button class="btn btn-info" onclick="verificarEstado()">📊 Verificar Estado</button>
                <button class="btn btn-warning" onclick="forcarSincronizacao()">⚡ Forçar Sync</button>
                <button class="btn btn-danger" onclick="limparTudo()">🗑️ Limpar Tudo</button>
            </div>
            <div>
                <h3>⚙️ Controles</h3>
                <button class="btn" onclick="syncClientes()">👥 Sync Clientes</button>
                <button class="btn" onclick="syncEspecies()">🌳 Sync Espécies</button>
                <button class="btn" onclick="syncRomaneios()">📋 Sync Romaneios</button>
                <button class="btn btn-info" onclick="ativarAutoStart()">🎯 Ativar Auto-Start</button>
            </div>
        </div>
        
        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        
        <div id="status" class="status">
            <h3>📊 Status</h3>
            <p>🔍 Pronto para sincronizar...</p>
        </div>
        
        <div id="log" class="log">
            <div id="logContent">📝 Log de sincronização aparecerá aqui...</div>
        </div>
        
        <div id="resultados" class="status">
            <h3>📁 Resultado da Sincronização</h3>
            <div id="resultadosContent">Aguardando sincronização...</div>
        </div>
    </div>

    <script>
        let logMessages = [];
        let syncProgress = 0;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logLine = `[${timestamp}] ${message}`;
            logMessages.push(logLine);
            
            if (logMessages.length > 150) {
                logMessages = logMessages.slice(-150);
            }
            
            updateLogDisplay();
            console.log(message);
        }
        
        function updateLogDisplay() {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML = logMessages.join('<br>');
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = `<h3>📊 Status</h3><p>${message}</p>`;
        }
        
        function updateResultados(dados) {
            const resultadosContent = document.getElementById('resultadosContent');
            resultadosContent.innerHTML = dados;
        }
        
        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${percent}%`;
            syncProgress = percent;
        }
        
        async function verificarFirebase() {
            log('🔥 Verificando disponibilidade do Firebase...');
            
            try {
                // Tentar várias formas de acessar Firebase
                if (window.firebase && window.firebase.database) {
                    log('✅ Firebase SDK disponível');
                    return { available: true, method: 'SDK' };
                }
                
                if (window.firebaseService) {
                    log('✅ FirebaseService disponível');
                    return { available: true, method: 'Service' };
                }
                
                if (window.authService) {
                    log('✅ AuthService disponível');
                    return { available: true, method: 'Auth' };
                }
                
                // Tentar acessar via funções do sistema
                if (window.getData || window.saveData) {
                    log('✅ Funções de dados disponíveis');
                    return { available: true, method: 'Functions' };
                }
                
                log('❌ Firebase não encontrado');
                return { available: false, method: null };
                
            } catch (error) {
                log(`❌ Erro ao verificar Firebase: ${error.message}`);
                return { available: false, method: null };
            }
        }

        function resolveCompanyId() {
            try {
                const svc = window.firebaseService || window.firebaseServiceTL || window.FirebaseService;
                if (svc && typeof svc.getTenantId === 'function') {
                    const t = svc.getTenantId();
                    if (t) return String(t);
                }
            } catch (_) {}
            try {
                if (window.appTenantId) return String(window.appTenantId);
                if (window.companyInfo) {
                    const raw = window.companyInfo;
                    const id = raw.companyId || raw.companyID || raw.tenantId || raw.id;
                    if (id) return String(id);
                }
                const stored = localStorage.getItem('company_info');
                if (stored) {
                    const obj = JSON.parse(stored);
                    const id = obj && (obj.companyId || obj.companyID || obj.tenantId || obj.id);
                    if (id) return String(id);
                }
            } catch (_) {}
            return null;
        }

        function getLocalStorageKeys(key) {
            const keys = [];
            try {
                const base = String(key || '');
                if (!base) return keys;
                const svc = window.firebaseService || window.firebaseServiceTL || window.FirebaseService;
                if (svc && typeof svc.getNamespacedPath === 'function') {
                    const ns = svc.getNamespacedPath(base);
                    if (ns && ns !== base) keys.push(ns);
                } else {
                    const companyId = resolveCompanyId();
                    if (companyId && !/^companies\//.test(base) && !/^users\//.test(base)) {
                        keys.push(`companies/${companyId}/${base}`);
                    }
                }
                keys.push(base);
            } catch (_) {}
            return [...new Set(keys)];
        }

        function readLocalStorageValue(key) {
            for (const k of getLocalStorageKeys(key)) {
                const val = localStorage.getItem(k);
                if (val) return val;
            }
            return null;
        }

        function writeLocalStorageValue(key, data) {
            const payload = JSON.stringify(data);
            for (const k of getLocalStorageKeys(key)) {
                localStorage.setItem(k, payload);
            }
        }

        async function verificarLocalStorage() {
            log('📱 Verificando estado do localStorage...');
            
            const estado = {
                clientes: 0,
                especies: 0,
                romaneios: 0,
                total: 0,
                precisaSync: false
            };
            
            // Verificar clientes
            const clientes = readLocalStorageValue('clientes');
            if (clientes) {
                try {
                    const parsed = JSON.parse(clientes);
                    estado.clientes = Array.isArray(parsed) ? parsed.length : 1;
                } catch (e) {}
            }
            
            // Verificar espécies
            const especies = readLocalStorageValue('especies');
            if (especies) {
                try {
                    const parsed = JSON.parse(especies);
                    estado.especies = Array.isArray(parsed) ? parsed.length : 1;
                } catch (e) {}
            }
            
            // Verificar romaneios
            const romaneios = readLocalStorageValue('romaneiosPct');
            if (romaneios) {
                try {
                    const parsed = JSON.parse(romaneios);
                    estado.romaneios = Array.isArray(parsed) ? parsed.length : 1;
                } catch (e) {}
            }
            
            estado.total = estado.clientes + estado.especies + estado.romaneios;
            
            // Determinar se precisa sincronizar
            estado.precisaSync = (
                estado.clientes === 0 || 
                estado.especies === 0 || 
                estado.total < 50  // Threshold mínimo
            );
            
            log(`📊 localStorage: ${estado.clientes} clientes, ${estado.especies} espécies, ${estado.romaneios} romaneios`);
            log(`🎯 Precisa sincronizar: ${estado.precisaSync ? 'SIM' : 'NÃO'}`);
            
            return estado;
        }
        
        async function downloadFromFirebase(key, alternativeKeys = []) {
            log(`📥 Baixando ${key} do Firebase...`);
            
            try {
                // Estratégia 1: Usar getData se disponível
                if (window.getData) {
                    try {
                        const data = await window.getData(key);
                        if (data && (Array.isArray(data) ? data.length > 0 : true)) {
                            log(`✅ ${key} obtido via getData: ${Array.isArray(data) ? data.length : 1} itens`);
                            return data;
                        }
                    } catch (e) {
                        log(`⚠️ Erro getData(${key}): ${e.message}`);
                    }
                }
                
                // Estratégia 2: Tentar chaves alternativas
                for (const altKey of alternativeKeys) {
                    if (window.getData) {
                        try {
                            const data = await window.getData(altKey);
                            if (data && (Array.isArray(data) ? data.length > 0 : true)) {
                                log(`✅ ${key} obtido via getData(${altKey}): ${Array.isArray(data) ? data.length : 1} itens`);
                                return data;
                            }
                        } catch (e) {
                            log(`⚠️ Erro getData(${altKey}): ${e.message}`);
                        }
                    }
                }
                
                // Estratégia 3: Acessar Firebase diretamente
                if (window.firebase && window.firebase.database) {
                    try {
                        const ref = window.firebase.database().ref(key);
                        const snapshot = await ref.once('value');
                        const data = snapshot.val();
                        
                        if (data) {
                            log(`✅ ${key} obtido do Firebase direto: ${Array.isArray(data) ? data.length : 1} itens`);
                            return data;
                        }
                    } catch (e) {
                        log(`⚠️ Erro Firebase direto(${key}): ${e.message}`);
                    }
                }
                
                // Estratégia 4: Procurar em localStorage com chaves relacionadas
                const localKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const localKey = localStorage.key(i);
                    if (localKey && (
                        localKey.toLowerCase().includes(key.toLowerCase()) ||
                        alternativeKeys.some(alt => localKey.toLowerCase().includes(alt.toLowerCase()))
                    )) {
                        localKeys.push(localKey);
                    }
                }
                
                for (const localKey of localKeys) {
                    try {
                        const data = JSON.parse(localStorage.getItem(localKey));
                        if (data && (Array.isArray(data) ? data.length > 0 : true)) {
                            log(`✅ ${key} encontrado em localStorage.${localKey}: ${Array.isArray(data) ? data.length : 1} itens`);
                            return data;
                        }
                    } catch (e) {}
                }
                
                log(`❌ ${key} não encontrado em nenhum lugar`);
                return null;
                
            } catch (error) {
                log(`❌ Erro ao baixar ${key}: ${error.message}`);
                return null;
            }
        }
        
        async function syncClientes() {
            log('👥 Sincronizando clientes...');
            updateProgress(10);
            
            const data = await downloadFromFirebase('clientes', ['clients', 'clientesPct', 'clientesTora']);
            
            if (data) {
                writeLocalStorageValue('clientes', data);
                const count = Array.isArray(data) ? data.length : 1;
                log(`✅ ${count} clientes sincronizados`);
                updateProgress(25);
                return count;
            } else {
                log('❌ Falha ao sincronizar clientes');
                return 0;
            }
        }
        
        async function syncEspecies() {
            log('🌳 Sincronizando espécies...');
            updateProgress(30);
            
            const data = await downloadFromFirebase('especies');
            
            if (data) {
                writeLocalStorageValue('especies', data);
                const count = Array.isArray(data) ? data.length : 1;
                log(`✅ ${count} espécies sincronizadas`);
                updateProgress(60);
                return count;
            } else {
                log('❌ Falha ao sincronizar espécies');
                return 0;
            }
        }
        
        async function syncRomaneios() {
            log('📋 Sincronizando romaneios...');
            updateProgress(70);

            log('⛔ Sincronização local de romaneios desativada. Use apenas companies/{companyId}/romaneios/{pct,tl,pes,tora}.');
            updateProgress(85);
            return 0;
        }
        
        async function verificarEstado() {
            log('🔍 Verificando estado completo do sistema...');
            updateStatus('🔍 Verificando...', 'info');
            
            const firebase = await verificarFirebase();
            const localStorage = await verificarLocalStorage();
            
            let html = '<strong>📊 Estado do Sistema:</strong><br><br>';
            
            html += '<strong>🔥 Firebase:</strong><br>';
            html += `&nbsp;&nbsp;Status: ${firebase.available ? '✅ Disponível' : '❌ Indisponível'}<br>`;
            if (firebase.method) {
                html += `&nbsp;&nbsp;Método: ${firebase.method}<br>`;
            }
            html += '<br>';
            
            html += '<strong>📱 localStorage:</strong><br>';
            html += `&nbsp;&nbsp;👥 Clientes: ${localStorage.clientes}<br>`;
            html += `&nbsp;&nbsp;🌳 Espécies: ${localStorage.especies}<br>`;
            html += `&nbsp;&nbsp;📋 Romaneios: ${localStorage.romaneios}<br>`;
            html += `&nbsp;&nbsp;📊 Total: ${localStorage.total}<br>`;
            html += `&nbsp;&nbsp;🎯 Precisa Sync: ${localStorage.precisaSync ? '✅ SIM' : '❌ NÃO'}<br>`;
            
            updateResultados(html);
            updateStatus(`Firebase: ${firebase.available ? 'OK' : 'ERRO'} | localStorage: ${localStorage.total} itens`, firebase.available ? 'success' : 'error');
            
            return { firebase, localStorage };
        }
        
        async function forcarSincronizacao() {
            log('⚡ Forçando sincronização completa...');
            updateStatus('⚡ Sincronizando...', 'warning');
            updateProgress(0);
            
            try {
                let totalSincronizado = 0;
                
                // Sync clientes
                const clientesCount = await syncClientes();
                totalSincronizado += clientesCount;
                
                // Sync espécies
                const especiesCount = await syncEspecies();
                totalSincronizado += especiesCount;
                
                // Sync romaneios
                const romaneiosCount = await syncRomaneios();
                totalSincronizado += romaneiosCount;
                
                updateProgress(100);
                
                log(`🎉 Sincronização completa! ${totalSincronizado} itens sincronizados`);
                updateStatus(`✅ ${totalSincronizado} itens sincronizados`, 'success');
                
                // Atualizar resultados
                let html = '<strong>✅ Sincronização Completa:</strong><br><br>';
                html += `👥 Clientes: ${clientesCount}<br>`;
                html += `🌳 Espécies: ${especiesCount}<br>`;
                html += `📋 Romaneios: ${romaneiosCount}<br><br>`;
                html += `<strong>📊 Total: ${totalSincronizado} itens</strong><br><br>`;
                html += '<strong>🎉 Sistema pronto para uso!</strong>';
                updateResultados(html);
                
                // Ativar função getData otimizada
                ativarGetDataOtimizado();
                
                return totalSincronizado;
                
            } catch (error) {
                log(`❌ Erro na sincronização: ${error.message}`);
                updateStatus('❌ Erro na sincronização', 'error');
                updateProgress(0);
                return 0;
            }
        }
        
        async function iniciarAutoSync() {
            log('🚀 Iniciando auto-sincronização inteligente...');
            
            const estado = await verificarEstado();
            
            if (!estado.firebase.available) {
                log('❌ Firebase indisponível - auto-sync cancelado');
                updateStatus('❌ Firebase indisponível', 'error');
                return;
            }
            
            if (!estado.localStorage.precisaSync) {
                log('✅ localStorage já possui dados suficientes');
                updateStatus('✅ Dados já disponíveis', 'success');
                ativarGetDataOtimizado();
                return;
            }
            
            log('🔄 localStorage precisa de sincronização - iniciando...');
            await forcarSincronizacao();
        }
        
        function ativarGetDataOtimizado() {
            log('⚙️ Ativando getData otimizado...');
            
            if (!window.originalGetData && window.getData) {
                window.originalGetData = window.getData;
            }
            
            window.getData = function(key) {
                // Priorizar localStorage
                const localData = readLocalStorageValue(key);
                if (localData) {
                    try {
                        const parsed = JSON.parse(localData);
                        if (Array.isArray(parsed) ? parsed.length > 0 : parsed) {
                            return parsed;
                        }
                    } catch (e) {
                        log(`⚠️ Erro ao parsear localStorage.${key}: ${e.message}`);
                    }
                }
                
                // Fallback para função original
                if (window.originalGetData) {
                    return window.originalGetData(key);
                }
                
                return null;
            };
            
            log('✅ getData otimizado ativado');
        }
        
        function ativarAutoStart() {
            log('🎯 Ativando auto-start na inicialização...');
            
            // Salvar configuração
            localStorage.setItem('autoSyncEnabled', 'true');
            
            // Configurar auto-start
            if (!window.autoSyncInitialized) {
                window.autoSyncInitialized = true;
                
                // Auto-sync quando página carregar
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(() => {
                        if (localStorage.getItem('autoSyncEnabled') === 'true') {
                            iniciarAutoSync();
                        }
                    }, 2000);
                });
                
                // Auto-sync periódico (a cada 5 minutos)
                setInterval(() => {
                    if (localStorage.getItem('autoSyncEnabled') === 'true') {
                        verificarEstado().then(estado => {
                            if (estado.localStorage.precisaSync) {
                                log('🔄 Auto-sync periódico detectou necessidade de sincronização');
                                iniciarAutoSync();
                            }
                        });
                    }
                }, 5 * 60 * 1000); // 5 minutos
            }
            
            updateStatus('✅ Auto-start ativado!', 'success');
            log('✅ Auto-start configurado - sincronização automática ativa');
        }
        
        function limparTudo() {
            log('🗑️ Limpando tudo...');
            
            // Limpar localStorage relevante
            const keysToRemove = ['clientes', 'especies', 'romaneiosPct', 'species', 'clients'];
            keysToRemove.forEach(key => {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                    log(`🗑️ ${key} removido do localStorage`);
                }
            });
            
            // Restaurar getData original
            if (window.originalGetData) {
                window.getData = window.originalGetData;
                delete window.originalGetData;
                log('🔄 getData original restaurado');
            }
            
            // Desativar auto-sync
            localStorage.removeItem('autoSyncEnabled');
            
            updateProgress(0);
            updateStatus('🗑️ Tudo limpo', 'info');
            updateResultados('Aguardando nova sincronização...');
            
            log('✅ Limpeza completa finalizada');
        }
        
        // Inicialização automática
        window.addEventListener('load', () => {
            log('🚀 Auto-Sync Firebase carregado');
            
            // Verificar se auto-start está ativado
            if (localStorage.getItem('autoSyncEnabled') === 'true') {
                log('🎯 Auto-start detectado - iniciando em 3 segundos...');
                setTimeout(() => {
                    iniciarAutoSync();
                }, 3000);
            } else {
                // Apenas verificar estado inicial
                setTimeout(() => {
                    verificarEstado();
                }, 1000);
            }
        });
    </script>
    <script src="global-footer.js?v=7ab6d2f87bf7"></script>
</body>
</html>
