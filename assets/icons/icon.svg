<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sisweb app icon</title>
  <desc id="desc">Professional Sisweb PWA icon for operations, warehouse, logistics and timber management.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="42" x2="448" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.46" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panel" x1="150" y1="120" x2="380" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="wood" x1="150" y1="302" x2="344" y2="356" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M92 88c70-52 190-64 291-17 36 17 65 42 82 73v-37c0-33-27-60-60-60H152c-23 0-44 13-60 41z" fill="#ffffff" opacity="0.12"/>
  <circle cx="414" cy="104" r="44" fill="#ffffff" opacity="0.08"/>
  <circle cx="104" cy="410" r="72" fill="#22c55e" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="104" y="112" width="304" height="304" rx="72" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- Warehouse outline, based on the clean stroke style used by modern icon libraries. -->
  <g transform="translate(112 92) scale(12)" fill="none" stroke="#f8fafc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/>
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/>
    <path d="M6 13h12"/>
    <path d="M6 17h12"/>
  </g>

  <!-- Timber/logistics cue. -->
  <g transform="translate(128 292)">
    <rect x="22" y="26" width="188" height="34" rx="17" fill="url(#wood)"/>
    <rect x="0" y="0" width="206" height="36" rx="18" fill="#d97706"/>
    <rect x="28" y="52" width="174" height="34" rx="17" fill="#92400e"/>
    <circle cx="206" cy="18" r="18" fill="#fbbf24" stroke="#78350f" stroke-opacity="0.32" stroke-width="4"/>
    <circle cx="210" cy="43" r="17" fill="#f59e0b" stroke="#78350f" stroke-opacity="0.28" stroke-width="4"/>
    <circle cx="202" cy="69" r="17" fill="#d97706" stroke="#78350f" stroke-opacity="0.26" stroke-width="4"/>
    <path d="M196 18h18M201 43h17M194 69h16" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
    <path d="M25 18h142M48 43h116M55 69h96" stroke="#ffedd5" stroke-width="4" stroke-linecap="round" opacity="0.34"/>
  </g>

  <!-- Operations panel. -->
  <g transform="translate(318 304)">
    <rect x="0" y="0" width="74" height="76" rx="18" fill="#f8fafc" opacity="0.94"/>
    <path d="M18 22h38M18 38h22M18 54h32" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="54" r="8" fill="#10b981"/>
  </g>

  <path d="M148 404h216" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
</svg>
