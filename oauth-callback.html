<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação — Sisweb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f5f5;
    }
    .card {
      background: white; border-radius: 12px; padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1); text-align: center; max-width: 360px; width: 90%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { color: #2c3e50; margin-bottom: 8px; }
    p  { color: #666; font-size: 14px; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #ddd;
      border-top-color: #2c3e50; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #e74c3c; font-weight: 600; }
    .success { color: #27ae60; font-weight: 600; }
  </style>

    <!-- 🛡️ Sentry: monitoramento de erros em produção (local, sem CDN) -->
    <script src="sentry/sentry.browser.min.js?v=189d0638b24b"></script>
    <script src="sentry-init.js?v=e4dadfaea86a"></script></head>
<body>
  <div class="card" id="card">
    <div class="icon">🔐</div>
    <h2>Autenticando…</h2>
    <div class="spinner"></div>
    <p id="msg">Processando autorização do certificado digital…</p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const state  = params.get('state');
      const error  = params.get('error');
      const errDesc = params.get('error_description');

      function showResult(ok, title, msg) {
        const card = document.getElementById('card');
        card.querySelector('.icon').textContent = ok ? '✅' : '❌';
        card.querySelector('h2').textContent = title;
        card.querySelector('.spinner').style.display = 'none';
        const el = card.querySelector('#msg');
        el.textContent = msg;
        el.className = ok ? 'success' : 'error';
        setTimeout(() => { try { window.close(); } catch(_) {} }, ok ? 2000 : 4000);
      }

      if (error) {
        // Notificar janela pai sobre erro
        if (window.opener) {
          window.opener.postMessage({ type: 'nf_oauth_error', error: errDesc || error }, window.location.origin);
        }
        showResult(false, 'Autenticação Cancelada', errDesc || error);
        return;
      }

      if (!code || !state) {
        if (window.opener) {
          window.opener.postMessage({ type: 'nf_oauth_error', error: 'Código de autorização não recebido' }, window.location.origin);
        }
        showResult(false, 'Erro OAuth', 'Resposta inválida do provedor.');
        return;
      }

      // Tudo OK — enviar code para janela pai
      if (window.opener) {
        window.opener.postMessage({ type: 'nf_oauth_code', code, state }, window.location.origin);
        showResult(true, 'Autorizado!', 'Certificado em nuvem configurado com sucesso. Esta janela será fechada automaticamente.');
      } else {
        // Fallback: salvar no sessionStorage e fechar
        sessionStorage.setItem('nf_oauth_result', JSON.stringify({ code, state }));
        showResult(true, 'Autorizado!', 'Retorne à janela principal para concluir.');
      }
    })();
  </script>
</body>
</html>
