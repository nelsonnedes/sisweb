<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" href="/assets/brand/icone.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Fiscais (NF-e) - Sistema Sisweb</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css?v=c29e40bbd251">
    <link rel="stylesheet" href="styles/sisweb-tokens.css?v=48ded6f95e02">
    <link rel="stylesheet" href="styles/shell-theme.css?v=8c3beb0909c8">
    <link rel="stylesheet" href="styles/content-theme.css?v=db8b0cf45fdc">
    <link rel="stylesheet" href="layout-comum.css?v=c8c40e4b104d">
    <link rel="stylesheet" href="commerce-responsive.css?v=25cdcbb70daf">
    <link rel="stylesheet" href="ui-components.css?v=182b0b8037bb">
    <script src="js/sisweb-theme.js?v=4cb247ce57d4"></script>
    <script src="menu-component.js?v=23d8df568d6f"></script>
    <script src="sentry/sentry.browser.min.js?v=189d0638b24b"></script>
    <script src="sentry-init.js?v=a0ebe6edc1c6"></script>
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('sisweb:theme');
                var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
                var effective = mode === 'system'
                    && window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
                    : mode === 'system' ? 'dark' : mode;
                document.documentElement.setAttribute('data-theme', effective);
                document.documentElement.setAttribute('data-theme-mode', mode);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .page-title { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--sw-text-1); }
        .actions-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .search-box { flex: 1; position: relative; min-width: 250px; }
        .search-box input { width: 100%; padding: 10px 15px 10px 40px; border: 1px solid var(--sw-border); border-radius: 4px; font-size: 14px; height: 42px; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--sw-text-2); }
        .actions-bar .btn { height: 42px !important; white-space: nowrap; }
        .pf-empty { text-align: center; padding: 18px; color: var(--sw-text-2); font-style: italic; }
        .pf-actions { white-space: nowrap; text-align: center; }
        .pf-actions .btn { width: 32px; height: 32px; padding: 0; justify-content: center; }
        /* Paginação padrão (mesmo .nf-pagination-bar da Consulta de NF-e) */
        .nf-pagination-bar { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .nf-pagination-bar:empty { display: none; }
        .nf-pagination-bar .pagination-size-control { display: inline-flex; align-items: center; gap: 6px; color: var(--sw-text-2); font-size: 13px; margin-right: auto; }
        .nf-pagination-bar .pagination-size-control select { width: auto; min-width: 76px; height: 34px; padding: 4px 8px; font-size: 13px; color: var(--sw-text-1); background: var(--sw-surface); border: 1px solid var(--sw-border); border-radius: 6px; }
        .nf-pagination-bar .pagination-page-buttons { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .nf-pagination-bar .pagination-page-buttons button { min-width: 34px; height: 34px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--sw-text-1); background: var(--sw-surface); border: 1px solid var(--sw-border); border-radius: 6px; cursor: pointer; }
        .nf-pagination-bar .pagination-page-buttons button:hover:not(:disabled) { border-color: var(--sw-brand); color: var(--sw-brand); }
        .nf-pagination-bar .pagination-page-buttons button.active { background: var(--sw-brand); border-color: var(--sw-brand); color: #fff; }
        .nf-pagination-bar .pagination-page-buttons button:disabled { opacity: .45; cursor: default; }
        .nf-pagination-bar .pagination-total-info { font-size: 12px; color: var(--sw-text-2); }
        #pfModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9999; align-items: center; justify-content: center; padding: 16px; }
        #pfModal.active { display: flex; }
        #pfModal .modal-content { max-width: 820px; width: 100%; max-height: calc(100dvh - 40px); display: flex; flex-direction: column; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-group { flex: 1; min-width: 160px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: var(--sw-text-1); font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--sw-border); border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .modal-body { overflow-y: auto; }
        @media (max-width: 768px) {
            .actions-bar { flex-direction: column; }
            .search-box, .actions-bar .btn { width: 100%; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <main-menu></main-menu>

        <div class="page-header">
            <h1 class="page-title sw-page-title"><i class="fas fa-file-invoice"></i> Produtos Fiscais (NF-e)</h1>
        </div>

        <div class="actions-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="pfSearch" placeholder="Buscar por nome, código, NCM ou CFOP...">
            </div>
            <button type="button" id="pfNewBtn" class="btn btn-primary"><i class="fas fa-plus"></i> Novo Produto Fiscal</button>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Código</th>
                        <th>NCM</th>
                        <th>CFOP</th>
                        <th>Unidade</th>
                        <th>Preço</th>
                        <th class="actions-col text-center" width="100">Ações</th>
                    </tr>
                </thead>
                <tbody id="pfTableBody">
                    <tr><td colspan="7" class="pf-empty">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="pfPagination" class="nf-pagination-bar"></div>
    </div>

    <div id="pfModal" role="dialog" aria-modal="true" aria-labelledby="pfModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="pfModalTitle" class="modal-title">Novo Produto Fiscal</h2>
                <button type="button" class="close-modal" id="pfCloseModal">&times;</button>
            </div>
            <form id="pfForm">
                <div class="modal-body">
                    <input type="hidden" id="pfId">
                    <div class="form-group" style="margin-bottom:12px;">
                        <label for="pfNome">Nome / Descrição *</label>
                        <input type="text" id="pfNome" required placeholder="Ex: Madeira serrada - Angelim">
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label for="pfCodigo">Código (automático)</label><input type="text" id="pfCodigo" placeholder="Gerado automaticamente (editável)"></div>
                        <div class="form-group"><label for="pfNcm">NCM</label><input type="text" id="pfNcm" maxlength="8" inputmode="numeric" placeholder="8 dígitos"></div>
                        <div class="form-group"><label for="pfCfop">CFOP padrão</label><input type="text" id="pfCfop" maxlength="4" inputmode="numeric" placeholder="Ex: 5102"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label for="pfUnidade">Unidade</label><input type="text" id="pfUnidade" placeholder="M3 / UN / KG"></div>
                        <div class="form-group"><label for="pfPreco">Preço de venda (R$)</label><input type="text" id="pfPreco" inputmode="decimal" placeholder="0,00"></div>
                        <div class="form-group"><label for="pfValorPauta">Valor de pauta (R$)</label><input type="text" id="pfValorPauta" inputmode="decimal" placeholder="Opcional"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label for="pfCst">CST / CSOSN</label><input type="text" id="pfCst" maxlength="4" placeholder="Ex: 102"></div>
                        <div class="form-group"><label for="pfOrigem">Origem</label><input type="text" id="pfOrigem" maxlength="1" placeholder="0"></div>
                        <div class="form-group"><label for="pfCest">CEST</label><input type="text" id="pfCest" placeholder="Opcional"></div>
                        <div class="form-group" style="display:flex;align-items:flex-end;gap:8px;min-width:140px;">
                            <label style="display:flex;align-items:center;gap:8px;margin:0;font-weight:500;">
                                <input type="checkbox" id="pfImportado" style="width:auto;"> Importado
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="pfCancelBtn" class="btn btn-outline">Cancelar</button>
                    <button type="submit" id="pfSaveBtn" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import * as svc from './firebaseService.js?v=fdef24272f49';
        if (!window.firebaseService) window.firebaseService = svc;
    </script>
    <script src="js/sisweb-loading.js?v=58a3a6d83224"></script>
    <script src="js/produtos-fiscais.js?v=739f46df0dda"></script>
    <script src="commerce-responsive.js?v=ecda54bb2077"></script>
</body>
</html>
