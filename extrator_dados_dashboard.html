<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Extrator Inteligente de Dados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .btn {
            background: #4CAF50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
            transition: all 0.3s;
        }
        .btn:hover { background: #45a049; transform: scale(1.05); }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }
        .status {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
        }
        .success { background: rgba(76, 175, 80, 0.3); }
        .error { background: rgba(244, 67, 54, 0.3); }
        .warning { background: rgba(255, 193, 7, 0.3); }
        .log {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin: 15px 0;
            max-height: 350px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Extrator Inteligente de Dados</h1>
        <p>Detecta e extrai dados do sistema para sincronização</p>
        
        <div class="grid">
            <div>
                <h3>🎯 Ações Principais</h3>
                <button class="btn" onclick="detectarDados()">🔍 Detectar Dados</button>
                <button class="btn" onclick="extrairTodos()">📥 Extrair Todos</button>
                <button class="btn btn-warning" onclick="verificarLocalStorage()">📊 Ver localStorage</button>
                <button class="btn btn-danger" onclick="limparLog()">🗑️ Limpar Log</button>
            </div>
            <div>
                <h3>⚡ Ações Rápidas</h3>
                <button class="btn" onclick="extrairClientes()">👥 Extrair Clientes</button>
                <button class="btn" onclick="extrairEspecies()">🌳 Extrair Espécies</button>
                <button class="btn" onclick="extrairRomaneios()">📋 Extrair Romaneios</button>
                <button class="btn" onclick="ativarSincronizacao()">🚀 Ativar Sync</button>
            </div>
        </div>
        
        <div id="status" class="status">
            <h3>📊 Status</h3>
            <p>🔍 Pronto para detectar dados...</p>
        </div>
        
        <div id="log" class="log">
            <div id="logContent">📝 Log do extrator aparecerá aqui...</div>
        </div>
        
        <div id="resultados" class="status">
            <h3>📁 Dados Encontrados</h3>
            <div id="resultadosContent">Aguardando detecção...</div>
        </div>
    </div>

    <script>
        let logMessages = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logLine = `[${timestamp}] ${message}`;
            logMessages.push(logLine);
            
            if (logMessages.length > 100) {
                logMessages = logMessages.slice(-100);
            }
            
            updateLogDisplay();
            console.log(message);
        }
        
        function updateLogDisplay() {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML = logMessages.join('<br>');
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.innerHTML = `<h3>📊 Status</h3><p>${message}</p>`;
        }
        
        function updateResultados(dados) {
            const resultadosContent = document.getElementById('resultadosContent');
            resultadosContent.innerHTML = dados;
        }

        function resolveCompanyId() {
            try {
                const svc = window.firebaseService || window.firebaseServiceTL || window.FirebaseService;
                if (svc && typeof svc.getTenantId === 'function') {
                    const t = svc.getTenantId();
                    if (t) return String(t);
                }
            } catch (_) {}
            try {
                if (window.appTenantId) return String(window.appTenantId);
                if (window.companyInfo) {
                    const raw = window.companyInfo;
                    const id = raw.id || raw.companyId || raw.slug || raw.nome || raw.name;
                    if (id) return String(id);
                }
                const stored = localStorage.getItem('company_info');
                if (stored) {
                    const obj = JSON.parse(stored);
                    const id = obj && (obj.id || obj.companyId || obj.slug || obj.nome || obj.name);
                    if (id) return String(id);
                }
            } catch (_) {}
            return null;
        }

        function getLocalStorageKeys(key) {
            const keys = [];
            try {
                const base = String(key || '');
                if (!base) return keys;
                const svc = window.firebaseService || window.firebaseServiceTL || window.FirebaseService;
                if (svc && typeof svc.getNamespacedPath === 'function') {
                    const ns = svc.getNamespacedPath(base);
                    if (ns && ns !== base) keys.push(ns);
                } else {
                    const companyId = resolveCompanyId();
                    if (companyId && !/^companies\//.test(base) && !/^users\//.test(base)) {
                        keys.push(`companies/${companyId}/${base}`);
                    }
                }
                keys.push(base);
            } catch (_) {}
            return [...new Set(keys)];
        }

        function readLocalStorageValue(key) {
            for (const k of getLocalStorageKeys(key)) {
                const val = localStorage.getItem(k);
                if (val) return val;
            }
            return null;
        }

        function writeLocalStorageValue(key, data) {
            const payload = JSON.stringify(data);
            for (const k of getLocalStorageKeys(key)) {
                localStorage.setItem(k, payload);
            }
        }
        
        async function detectarDados() {
            log('🔍 Iniciando detecção inteligente de dados...');
            updateStatus('🔍 Detectando dados...', 'warning');
            
            const resultados = {
                localStorage: {},
                funcoes: {},
                variaveis: {},
                total: 0
            };
            
            try {
                // 1. Verificar localStorage completo
                log('📱 Verificando localStorage...');
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    
                    try {
                        const parsed = JSON.parse(value);
                        const count = Array.isArray(parsed) ? parsed.length : 1;
                        resultados.localStorage[key] = count;
                        resultados.total += count;
                        log(`📦 localStorage.${key}: ${count} itens`);
                    } catch {
                        log(`📄 localStorage.${key}: texto (${value.length} chars)`);
                    }
                }
                
                // 2. Verificar variáveis globais conhecidas
                log('🌐 Verificando variáveis globais...');
                const variaveis = [
                    'clientes', 'especies', 'romaneiosPct', 'dadosClientes', 'dadosEspecies', 
                    'romaneios', 'pctData', 'clientesList', 'especiesList', 'romaneiosList',
                    'allClientes', 'allEspecies', 'allRomaneios', 'clientesData', 'especiesData'
                ];
                
                variaveis.forEach(varName => {
                    if (window[varName]) {
                        const data = window[varName];
                        const count = Array.isArray(data) ? data.length : 1;
                        resultados.variaveis[varName] = count;
                        resultados.total += count;
                        log(`🔗 window.${varName}: ${count} itens`);
                    }
                });
                
                // 3. Verificar funções getData conhecidas
                log('⚙️ Verificando funções getData...');
                if (window.getData) {
                    resultados.funcoes['getData'] = 'Disponível';
                    log('✅ window.getData encontrado');
                }
                if (window.saveData) {
                    resultados.funcoes['saveData'] = 'Disponível';
                    log('✅ window.saveData encontrado');
                }
                
                // 4. Tentar chamar getData para chaves conhecidas
                if (window.getData) {
                    const keys = ['clientes', 'especies', 'romaneiosPct'];
                    for (const key of keys) {
                        try {
                            const data = await window.getData(key);
                            if (data) {
                                const count = Array.isArray(data) ? data.length : 1;
                                log(`🔄 getData('${key}'): ${count} itens`);
                                resultados.funcoes[`getData_${key}`] = count;
                                resultados.total += count;
                            }
                        } catch (error) {
                            log(`❌ Erro getData('${key}'): ${error.message}`);
                        }
                    }
                }
                
                // 5. Verificar Firebase se disponível
                if (window.firebaseService?.authService) {
                    log('☁️ Firebase disponível - tentando acessar...');
                    resultados.funcoes['firebase'] = 'Disponível';
                } else {
                    log('☁️ Firebase indisponível');
                    resultados.funcoes['firebase'] = 'Indisponível';
                }
                
                log(`🎉 Detecção concluída! Total: ${resultados.total} itens encontrados`);
                updateStatus(`✅ ${resultados.total} itens detectados`, 'success');
                
                // Atualizar resultados na tela
                let html = '<strong>📊 Resumo da Detecção:</strong><br><br>';
                
                if (Object.keys(resultados.localStorage).length > 0) {
                    html += '<strong>📱 localStorage:</strong><br>';
                    Object.entries(resultados.localStorage).forEach(([key, count]) => {
                        html += `&nbsp;&nbsp;${key}: ${count} itens<br>`;
                    });
                    html += '<br>';
                }
                
                if (Object.keys(resultados.variaveis).length > 0) {
                    html += '<strong>🌐 Variáveis Globais:</strong><br>';
                    Object.entries(resultados.variaveis).forEach(([key, count]) => {
                        html += `&nbsp;&nbsp;${key}: ${count} itens<br>`;
                    });
                    html += '<br>';
                }
                
                if (Object.keys(resultados.funcoes).length > 0) {
                    html += '<strong>⚙️ Funções:</strong><br>';
                    Object.entries(resultados.funcoes).forEach(([key, value]) => {
                        html += `&nbsp;&nbsp;${key}: ${value}<br>`;
                    });
                }
                
                updateResultados(html);
                
                return resultados;
                
            } catch (error) {
                log(`❌ Erro na detecção: ${error.message}`);
                updateStatus('❌ Erro na detecção', 'error');
                return null;
            }
        }
        
        async function extrairTodos() {
            log('📥 Iniciando extração completa...');
            updateStatus('📥 Extraindo dados...', 'warning');
            
            try {
                let totalExtraido = 0;
                
                // Extrair clientes
                const clientesCount = await extrairClientes(false);
                totalExtraido += clientesCount;
                
                // Extrair espécies
                const especiesCount = await extrairEspecies(false);
                totalExtraido += especiesCount;
                
                // Extrair romaneios
                const romaneiosCount = await extrairRomaneios(false);
                totalExtraido += romaneiosCount;
                
                log(`🎉 Extração completa! ${totalExtraido} itens extraídos`);
                updateStatus(`✅ ${totalExtraido} itens extraídos`, 'success');
                
                // Ativar sincronização automaticamente
                setTimeout(() => {
                    ativarSincronizacao();
                }, 1000);
                
            } catch (error) {
                log(`❌ Erro na extração: ${error.message}`);
                updateStatus('❌ Erro na extração', 'error');
            }
        }
        
        async function extrairClientes(logIndividual = true) {
            if (logIndividual) log('👥 Extraindo clientes...');
            
            let clientesData = null;
            let count = 0;
            
            // Estratégia 1: localStorage direto
            const localClientes = readLocalStorageValue('clientes');
            if (localClientes) {
                try {
                    clientesData = JSON.parse(localClientes);
                    count = Array.isArray(clientesData) ? clientesData.length : 1;
                    if (count > 0) {
                        log(`✅ Clientes do localStorage: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro ao parsear clientes localStorage: ${e.message}`);
                }
            }
            
            // Estratégia 2: Função getData
            if (window.getData && !clientesData) {
                try {
                    clientesData = await window.getData('clientes');
                    if (clientesData) {
                        count = Array.isArray(clientesData) ? clientesData.length : 1;
                        writeLocalStorageValue('clientes', clientesData);
                        log(`✅ Clientes via getData: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro getData clientes: ${e.message}`);
                }
            }
            
            // Estratégia 3: Variáveis globais
            const variaveis = ['clientes', 'dadosClientes', 'clientesList', 'allClientes', 'clientesData'];
            for (const varName of variaveis) {
                if (window[varName] && !clientesData) {
                    clientesData = window[varName];
                    count = Array.isArray(clientesData) ? clientesData.length : 1;
                    if (count > 0) {
                        writeLocalStorageValue('clientes', clientesData);
                        log(`✅ Clientes de window.${varName}: ${count}`);
                        return count;
                    }
                }
            }
            
            // Estratégia 4: Procurar em todas as chaves do localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.toLowerCase().includes('client')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(data) && data.length > 0) {
                            if (data[0].nome || data[0].name || data[0].cliente) {
                                writeLocalStorageValue('clientes', data);
                                count = data.length;
                                log(`✅ Clientes encontrados em ${key}: ${count}`);
                                return count;
                            }
                        }
                    } catch (e) {}
                }
            }
            
            if (logIndividual) log('❌ Nenhum cliente encontrado');
            return 0;
        }
        
        async function extrairEspecies(logIndividual = true) {
            if (logIndividual) log('🌳 Extraindo espécies...');
            
            let especiesData = null;
            let count = 0;
            
            // Estratégia 1: localStorage direto
            const localEspecies = readLocalStorageValue('especies');
            if (localEspecies) {
                try {
                    especiesData = JSON.parse(localEspecies);
                    count = Array.isArray(especiesData) ? especiesData.length : 1;
                    if (count > 0) {
                        log(`✅ Espécies do localStorage: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro ao parsear espécies localStorage: ${e.message}`);
                }
            }
            
            // Estratégia 1b: Tentar chave 'species' diretamente
            const localSpecies = readLocalStorageValue('species');
            if (localSpecies && !especiesData) {
                try {
                    especiesData = JSON.parse(localSpecies);
                    count = Array.isArray(especiesData) ? especiesData.length : 1;
                    if (count > 0) {
                        writeLocalStorageValue('especies', especiesData);
                        log(`✅ Espécies do localStorage.species: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro ao parsear species localStorage: ${e.message}`);
                }
            }
            
            // Estratégia 2: Função getData
            if (window.getData && !especiesData) {
                try {
                    especiesData = await window.getData('especies');
                    if (especiesData) {
                        count = Array.isArray(especiesData) ? especiesData.length : 1;
                        writeLocalStorageValue('especies', especiesData);
                        log(`✅ Espécies via getData: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro getData espécies: ${e.message}`);
                }
            }
            
            // Estratégia 2b: Tentar getData com 'species'
            if (window.getData && !especiesData) {
                try {
                    especiesData = await window.getData('species');
                    if (especiesData) {
                        count = Array.isArray(especiesData) ? especiesData.length : 1;
                        writeLocalStorageValue('especies', especiesData);
                        log(`✅ Espécies via getData('species'): ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro getData species: ${e.message}`);
                }
            }
            
            // Estratégia 3: Variáveis globais
            const variaveis = ['especies', 'species', 'dadosEspecies', 'especiesList', 'allEspecies', 'especiesData'];
            for (const varName of variaveis) {
                if (window[varName] && !especiesData) {
                    especiesData = window[varName];
                    count = Array.isArray(especiesData) ? especiesData.length : 1;
                    if (count > 0) {
                        writeLocalStorageValue('especies', especiesData);
                        log(`✅ Espécies de window.${varName}: ${count}`);
                        return count;
                    }
                }
            }
            
            // Estratégia 4: Procurar em todas as chaves do localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.toLowerCase().includes('especi') || key.toLowerCase().includes('species'))) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(data) && data.length > 0) {
                            // Verificar se parece com dados de espécies
                            if (data[0].nome || data[0].especie || data[0].nomeComum || data[0].name || data[0].scientificName) {
                                writeLocalStorageValue('especies', data);
                                count = data.length;
                                log(`✅ Espécies encontradas em ${key}: ${count}`);
                                return count;
                            }
                        }
                    } catch (e) {}
                }
            }
            
            if (logIndividual) log('❌ Nenhuma espécie encontrada');
            return 0;
        }
        
        async function extrairRomaneios(logIndividual = true) {
            if (logIndividual) log('📋 Extraindo romaneios...');
            
            let romaneiosData = null;
            let count = 0;
            
            // Estratégia 1: localStorage direto
            const localRomaneios = readLocalStorageValue('romaneiosPct');
            if (localRomaneios) {
                try {
                    romaneiosData = JSON.parse(localRomaneios);
                    count = Array.isArray(romaneiosData) ? romaneiosData.length : 1;
                    if (count > 0) {
                        log(`✅ Romaneios do localStorage: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro ao parsear romaneios localStorage: ${e.message}`);
                }
            }
            
            // Estratégia 2: Função getData
            if (window.getData && !romaneiosData) {
                try {
                    romaneiosData = await window.getData('romaneios/pct');
                    if (romaneiosData) {
                        count = Array.isArray(romaneiosData) ? romaneiosData.length : 1;
                        writeLocalStorageValue('romaneiosPct', romaneiosData);
                        log(`✅ Romaneios via getData: ${count}`);
                        return count;
                    }
                } catch (e) {
                    log(`⚠️ Erro getData romaneios: ${e.message}`);
                }
            }
            
            // Estratégia 3: Variáveis globais
            const variaveis = ['romaneiosPct', 'romaneios', 'pctData', 'romaneiosList', 'allRomaneios'];
            for (const varName of variaveis) {
                if (window[varName] && !romaneiosData) {
                    romaneiosData = window[varName];
                    count = Array.isArray(romaneiosData) ? romaneiosData.length : 1;
                    if (count > 0) {
                        writeLocalStorageValue('romaneiosPct', romaneiosData);
                        log(`✅ Romaneios de window.${varName}: ${count}`);
                        return count;
                    }
                }
            }
            
            // Estratégia 4: Procurar em todas as chaves do localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.toLowerCase().includes('romaneio') || key.toLowerCase().includes('pct'))) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (Array.isArray(data) && data.length > 0) {
                            writeLocalStorageValue('romaneiosPct', data);
                            count = data.length;
                            log(`✅ Romaneios encontrados em ${key}: ${count}`);
                            return count;
                        }
                    } catch (e) {}
                }
            }
            
            if (logIndividual) log('❌ Nenhum romaneio encontrado');
            return 0;
        }
        
        function verificarLocalStorage() {
            log('📊 Verificando localStorage completo...');
            
            let total = 0;
            let html = '<strong>📱 Conteúdo do localStorage:</strong><br><br>';
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = readLocalStorageValue(key);
                
                try {
                    const parsed = JSON.parse(value);
                    const count = Array.isArray(parsed) ? parsed.length : 1;
                    total += count;
                    html += `📦 <strong>${key}</strong>: ${count} itens<br>`;
                    log(`📦 ${key}: ${count} itens`);
                } catch {
                    html += `📄 <strong>${key}</strong>: texto (${value.length} chars)<br>`;
                    log(`📄 ${key}: texto (${value.length} chars)`);
                }
            }
            
            html += `<br><strong>Total: ${total} itens</strong>`;
            updateResultados(html);
            updateStatus(`📊 ${localStorage.length} chaves encontradas`, 'info');
        }
        
        function ativarSincronizacao() {
            log('🚀 Ativando sistema de sincronização...');
            
            try {
                // Backup das funções originais
                if (!window.originalGetData && window.getData) {
                    window.originalGetData = window.getData;
                    log('💾 Backup getData criado');
                }
                if (!window.originalSaveData && window.saveData) {
                    window.originalSaveData = window.saveData;
                    log('💾 Backup saveData criado');
                }
                
                // Sobrescrever getData para priorizar localStorage
                window.getData = function(key) {
                    const localData = readLocalStorageValue(key);
                    if (localData) {
                        try {
                            return JSON.parse(localData);
                        } catch (e) {
                            log(`⚠️ Erro ao parsear ${key}: ${e.message}`);
                        }
                    }
                    return null;
                };
                
                // Marcar como ativo
                window.sincronizacaoAtiva = true;
                
                log('✅ Sincronização ativada com sucesso!');
                updateStatus('✅ Sincronização ativa!', 'success');
                
                // Verificar dados finais
                setTimeout(() => {
                    const clientes = window.getData('clientes');
                    const especies = window.getData('especies');
                    const romaneios = window.getData('romaneios/pct');
                    
                    const clientesCount = clientes ? (Array.isArray(clientes) ? clientes.length : 1) : 0;
                    const especiesCount = especies ? (Array.isArray(especies) ? especies.length : 1) : 0;
                    const romaneiosCount = romaneios ? (Array.isArray(romaneios) ? romaneios.length : 1) : 0;
                    
                    log(`📊 Dados ativos: ${clientesCount} clientes, ${especiesCount} espécies, ${romaneiosCount} romaneios`);
                    
                    let html = '<strong>✅ Sistema Sincronizado:</strong><br><br>';
                    html += `👥 Clientes: ${clientesCount}<br>`;
                    html += `🌳 Espécies: ${especiesCount}<br>`;
                    html += `📋 Romaneios: ${romaneiosCount}<br><br>`;
                    html += '<strong>🎉 Pronto para usar!</strong>';
                    updateResultados(html);
                }, 500);
                
            } catch (error) {
                log(`❌ Erro ao ativar sincronização: ${error.message}`);
                updateStatus('❌ Erro na ativação', 'error');
            }
        }
        
        function limparLog() {
            logMessages = [];
            updateLogDisplay();
            log('🗑️ Log limpo');
        }
        
        // Inicialização automática
