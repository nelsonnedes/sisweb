        // Função para mostrar/esconder menu de impressão
        function togglePrintMenu(button, evt) {
            if (evt && typeof evt.stopPropagation === 'function') {
                evt.stopPropagation();
            }
            const menu = button && button.nextElementSibling;
            if (!menu) return;
            const allMenus = document.querySelectorAll('.print-menu');
            const wasOpen = menu.classList.contains('show');
            allMenus.forEach(m => {
                m.classList.remove('show');
                m.style.position = '';
                m.style.left = '';
                m.style.top = '';
                m.style.right = '';
                m.style.bottom = '';
                m.style.zIndex = '';
                m.style.transform = '';
            });
            if (wasOpen) return;
            menu.classList.add('show');
            menu.style.position = 'fixed';
            menu.style.zIndex = '1000001';
            const rect = button.getBoundingClientRect();
            const vw = window.innerWidth || document.documentElement.clientWidth || 0;
            const vh = window.innerHeight || document.documentElement.clientHeight || 0;
            const menuWidth = menu.offsetWidth || 180;
            const menuHeight = menu.offsetHeight || 120;
            let left = rect.right - menuWidth;
            if (left < 8) left = 8;
            if (left + menuWidth > vw - 8) left = Math.max(8, vw - menuWidth - 8);
            let top = rect.bottom + 6;
            if (top + menuHeight > vh - 8) top = Math.max(8, rect.top - menuHeight - 6);
            menu.style.left = `${left}px`;
            menu.style.top = `${top}px`;
            document.addEventListener('click', function closeMenu(e) {
                if (!button.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove('show');
                    menu.style.position = '';
                    menu.style.left = '';
                    menu.style.top = '';
                    menu.style.right = '';
                    menu.style.bottom = '';
                    menu.style.zIndex = '';
                    menu.style.transform = '';
                    document.removeEventListener('click', closeMenu);
                }
            }, { once: true });
        }

        function classificarConamaPorDimensoesMm(espessuraMm, larguraMm) {
            const espessuraCm = toNumberValue(espessuraMm) / 10;
            const larguraCm = toNumberValue(larguraMm) / 10;
            if (espessuraCm > 12 && larguraCm > 12) return 'Bloco, quadrado ou filé';
            if (espessuraCm > 7.0 && larguraCm > 20.0) return 'Pranchões';
            if (espessuraCm >= 4.0 && espessuraCm <= 7.0 && larguraCm > 20.0) return 'Prancha';
            if (espessuraCm > 4.0 && larguraCm >= 11.0 && larguraCm <= 20.0) return 'Viga';
            if (espessuraCm >= 4.0 && espessuraCm <= 8.0 && larguraCm >= 8.0 && larguraCm <= 11.0) return 'Vigota';
            if (espessuraCm >= 4.0 && espessuraCm <= 8.0 && larguraCm >= 5.0 && larguraCm <= 8.0) return 'Caibro';
            if (espessuraCm >= 1.0 && espessuraCm < 4.0 && larguraCm > 10.0) return 'Tábua';
            if (espessuraCm >= 2.0 && espessuraCm < 4.0 && larguraCm >= 2.0 && larguraCm <= 10.0) return 'Sarrafo';
            if (espessuraCm < 2.0 && larguraCm < 10.0) return 'Ripa';
            const categoriasAproximacao = [
                { nome: 'Bloco, quadrado ou filé', esp: 13.0, larg: 13.0 },
                { nome: 'Pranchões', esp: 8.0, larg: 21.0 },
                { nome: 'Prancha', esp: 5.5, larg: 21.0 },
                { nome: 'Viga', esp: 6.0, larg: 15.5 },
                { nome: 'Vigota', esp: 6.0, larg: 9.5 },
                { nome: 'Caibro', esp: 6.0, larg: 6.5 },
                { nome: 'Tábua', esp: 2.5, larg: 11.0 },
                { nome: 'Sarrafo', esp: 3.0, larg: 6.0 },
                { nome: 'Ripa', esp: 1.0, larg: 5.0 }
            ];
            if (espessuraCm <= 0 || larguraCm <= 0) return 'Ripa';
            let melhor = categoriasAproximacao[0];
            let menorDistancia = Number.POSITIVE_INFINITY;
            categoriasAproximacao.forEach((cat) => {
                const dEsp = espessuraCm - cat.esp;
                const dLarg = larguraCm - cat.larg;
                const distancia = Math.sqrt((dEsp * dEsp) + (dLarg * dLarg));
                if (distancia < menorDistancia) {
                    menorDistancia = distancia;
                    melhor = cat;
                }
            });
            return melhor.nome;
        }

        async function obterDadosEmpresaRelatorioPes() {
            const normalizeCompany = (company) => {
                const src = (company && typeof company === 'object') ? company : {};
                return {
                    id: src.id || src.companyId || src.companyID || src.tenantId || src.slug || '',
                    name: src.name || src.nome || src.razaoSocial || src.fantasia || src.companyName || '',
                    cnpj: src.cnpj || src.document || src.cpfCnpj || src.cnpjCpf || '',
                    address: src.address || src.endereco || '',
                    city: src.city || src.cidade || src.municipio || '',
                    state: src.state || src.estado || src.uf || '',
                    phone: src.phone || src.telefone || src.celular || src.fone || '',
                    logo: src.logo || src.logoUrl || src.image || src.imagem || ''
                };
            };
            const normalizeCollection = (raw) => {
                if (Array.isArray(raw)) return raw;
                if (raw && typeof raw === 'object') return Object.values(raw);
                return [];
            };
            let companies = [];
            let profileData = null;
            try {
                if (window.FirebaseService && typeof window.FirebaseService.getData === 'function') {
                    companies = await window.FirebaseService.getData('companies') || [];
                } else if (window.firebaseServiceTL && typeof window.firebaseServiceTL.getData === 'function') {
                    companies = await window.firebaseServiceTL.getData('companies') || [];
                } else if (window.firebaseService && typeof window.firebaseService.loadFromFirebase === 'function') {
                    const result = await window.firebaseService.loadFromFirebase('companies');
                    const data = result && result.success ? result.data : result;
                    companies = normalizeCollection(data);
                }
            } catch (_) {}
            let companyInfo = null;
            try {
                const raw = localStorage.getItem('company_info');
                if (raw) companyInfo = JSON.parse(raw);
            } catch (_) {}
            const tenant = window.appTenantId || (companyInfo && (companyInfo.id || companyInfo.companyId || companyInfo.companyID || companyInfo.tenantId || companyInfo.slug));
            const companiesArray = normalizeCollection(companies).map(normalizeCompany);
            try {
                if (tenant && window.firebaseService && typeof window.firebaseService.loadFromFirebase === 'function') {
                    const profileResult = await window.firebaseService.loadFromFirebase(`companies/${tenant}/profile`);
                    const profileRaw = profileResult && profileResult.success ? profileResult.data : profileResult;
                    if (profileRaw && typeof profileRaw === 'object') {
                        profileData = normalizeCompany(profileRaw);
                    }
                }
            } catch (_) {}
            if ((!profileData || !profileData.id) && tenant) {
                const companyFromMap = (companies && typeof companies === 'object' && !Array.isArray(companies)) ? companies[tenant] : null;
                if (companyFromMap && typeof companyFromMap === 'object') {
                    const nestedProfile = companyFromMap.profile && typeof companyFromMap.profile === 'object' ? companyFromMap.profile : {};
                    profileData = normalizeCompany({ ...companyFromMap, ...nestedProfile, id: tenant, companyId: tenant });
                }
            }
            let selected = {};
            if (tenant) {
                selected = profileData
                    || companiesArray.find((c) => String(c.id || '') === String(tenant))
                    || normalizeCompany(companyInfo || {});
                if (selected.id && String(selected.id) !== String(tenant)) {
                    selected = profileData || normalizeCompany(companyInfo || {});
                }
            } else if (companiesArray.length === 1) {
                selected = companiesArray[0];
            } else {
                selected = normalizeCompany(companyInfo || {});
            }
            const logo = selected.logo && String(selected.logo).trim() ? selected.logo : '';
            return {
                name: selected.name || 'Empresa não informada',
                cnpj: selected.cnpj || '-',
                address: selected.address || '-',
                city: selected.city || '-',
                state: selected.state || '-',
                phone: selected.phone || '-',
                logo
            };
        }

        nodes.forEach(function(el){
            el.addEventListener('blur', function(){
                var v = String(this.value || '').trim();
                if (!v) return;
                if (window.isAllCaps && window.toTitleCasePt && window.isAllCaps(v)) {
                    this.value = window.toTitleCasePt(v);
                }
            });
        });
